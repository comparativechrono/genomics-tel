<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mol*: an AlphaFold model coloured by confidence, with its predicted aligned error</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@5.12.0/build/viewer/molstar.css"
        integrity="sha384-RIontCdJN53gEl2fmiHN+4bscIBvaUaOiCeeGktXqmFqdEBF+COnSdt9O4IKFSvq"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/molstar@5.12.0/build/viewer/molstar.js"
          integrity="sha384-Mx9hwknXam3/nCj5WsEpyvr6nqiUp8vVLEh0ZG9OXpFepTFhVKTdEOJ4JG0XjMLf"
          crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px 16px; color: #172033; background: #fff; }
    h1 { font-size: 1.05rem; margin: 0 0 6px; }
    p { margin: 0 0 6px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 6px; }
    button, select { font: inherit; font-size: 14px; padding: 3px 8px; }
    #meta { font-size: 14px; color: #3b4659; }
    .legend { list-style: none; padding: 0; margin: 0 0 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 0 16px; font-size: 14px; }
    .swatch { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.35em; vertical-align: -0.1em; border: 1px solid #0003; }
    .panes { display: flex; flex-wrap: wrap; gap: 12px; }
    /* Mol* fills its container, so the container needs a height and a position */
    #viewer { position: relative; flex: 1 1 320px; height: 360px; }
    figure { margin: 0; flex: 0 1 260px; font-size: 13px; color: #3b4659; }
    figure img { display: block; width: 100%; height: auto; max-width: 260px; aspect-ratio: 1; border: 1px solid #c3cbd8; image-rendering: pixelated; }
    .key { display: flex; align-items: center; gap: 6px; margin: 4px 0; max-width: 260px; }
    .key .bar { flex: 1; height: 10px; background: linear-gradient(to right, #00471c, #f7fcf5); border: 1px solid #c3cbd8; }
    #status { min-height: 1.5em; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>How confident is AlphaFold about this protein?</h1>
  <div class="controls">
    <label for="protein">Protein</label>
    <select id="protein">
      <option value="P04637">p53, UniProt P04637</option>
      <option value="P0DP23">Calmodulin-1, UniProt P0DP23</option>
      <option value="P68871">β-globin, UniProt P68871</option>
    </select>
    <button type="button" id="low">Select residues with pLDDT below 50</button>
    <button type="button" id="clear">Clear</button>
  </div>
  <p id="meta">Asking AlphaFold DB for the model…</p>
  <!-- AlphaFold DB's confidence bands and colours. The text after each band is the text version of the 3D colours. -->
  <ul class="legend" id="legend"></ul>
  <div class="panes">
    <div id="viewer" role="region" aria-label="3D AlphaFold model coloured by per-residue confidence (pLDDT)"></div>
    <figure>
      <img id="pae" alt="">
      <div class="key" aria-hidden="true"><span>0 Å</span><span class="bar"></span><span>30 Å</span></div>
      <figcaption>Predicted aligned error (PAE). Both axes run from the first residue (top left) to the last. Dark green: AlphaFold is confident about where two residues sit relative to each other. White: it is not.</figcaption>
    </figure>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const BANDS = [
      { code: "H", name: "Very high", range: "90 and above", colour: "#0053d6", fraction: "fractionPlddtVeryHigh" },
      { code: "M", name: "Confident", range: "70 to 90", colour: "#65cbf3", fraction: "fractionPlddtConfident" },
      { code: "L", name: "Low", range: "50 to 70", colour: "#ffdb13", fraction: "fractionPlddtLow" },
      { code: "D", name: "Very low", range: "below 50", colour: "#ff7d45", fraction: "fractionPlddtVeryLow" }
    ];
    const $ = id => document.getElementById(id);
    const say = text => { $("status").textContent = text; };

    // The longest unbroken stretch of residues in each band, from the per-residue confidence file
    function longestStretches(conf) {
      const best = {};
      for (let start = 0, i = 1; i <= conf.residueNumber.length; i++) {
        if (i === conf.residueNumber.length || conf.confidenceCategory[i] !== conf.confidenceCategory[start]) {
          const band = conf.confidenceCategory[start];
          if (!best[band] || i - start > best[band].length)
            best[band] = { from: conf.residueNumber[start], to: conf.residueNumber[i - 1], length: i - start };
          start = i;
        }
      }
      return best;
    }

    async function show(viewer, accession) {
      say("");
      // 1. Ask the AlphaFold DB API which files are current. File names carry a version (v6 today),
      //    and old versions are deleted, so never hard-code a file address.
      const response = await fetch("https://alphafold.ebi.ac.uk/api/prediction/" + accession);
      if (!response.ok) throw new Error("AlphaFold DB answered " + response.status);
      const entry = (await response.json())[0];
      $("meta").textContent = entry.uniprotDescription + " (" + entry.gene + ", " + entry.organismScientificName + "). " +
        "Model " + entry.modelEntityId + ", version " + entry.latestVersion + ", made " + entry.modelCreatedDate.slice(0, 10) +
        ". Mean pLDDT " + entry.globalMetricValue.toFixed(1) + ".";

      // 2. The per-residue scores give a text version of the colours
      const conf = await (await fetch(entry.plddtDocUrl)).json();
      const longest = longestStretches(conf);
      $("legend").innerHTML = BANDS.map(b => {
        const run = longest[b.code];
        return '<li><span class="swatch" style="background:' + b.colour + '"></span><b>' + b.name + "</b> (" + b.range + "): " +
          Math.round(entry[b.fraction] * 100) + "% of residues" +
          (run ? "; longest stretch: " + (run.length > 1 ? "residues " + run.from + "–" + run.to : "residue " + run.from) : "") + "</li>";
      }).join("");

      // 3. The model itself, coloured by pLDDT (one-line alternative: viewer.loadAlphaFoldDb(accession))
      await viewer.plugin.clear();
      await viewer.loadStructureFromUrl(entry.bcifUrl, "mmcif", true, {
        representationParams: { theme: { globalName: "plddt-confidence" } },
        label: entry.modelEntityId
      });

      // 4. The predicted aligned error, as AlphaFold DB draws it
      $("pae").src = entry.paeImageUrl;
      $("pae").alt = "Predicted aligned error plot for " + entry.modelEntityId + ", " + entry.uniprotDescription;
    }

    async function start() {
      const viewer = await molstar.Viewer.create("viewer", {
        layoutIsExpanded: false, layoutShowControls: false,
        viewportShowAnimation: false, viewportShowSelectionMode: false
      });
      const load = () => show(viewer, $("protein").value).catch(err => {
        console.error(err);
        $("meta").textContent = "Could not load the AlphaFold model: " + err.message;
      });
      $("protein").addEventListener("change", load);

      // AlphaFold files keep pLDDT in the B-factor column, so a query on B_iso_or_equiv finds low-confidence residues
      $("low").onclick = () => {
        viewer.structureInteractivity({
          expression: Q => Q.struct.generator.atomGroups({
            "residue-test": Q.core.rel.lt([Q.struct.atomProperty.macromolecular.B_iso_or_equiv(), 50])
          }),
          action: "select"
        });
        const stats = viewer.plugin.managers.structure.selection.stats;
        say(stats.elementCount ? "Selected (in green): " + stats.label.replace(/<[^>]+>/g, "") + "." : "No residues have a pLDDT below 50.");
      };
      $("clear").onclick = () => {
        viewer.structureInteractivity({ action: ["select", "highlight"] });
        viewer.plugin.managers.camera.reset();
        say("");
      };
      await load();
    }

    start().catch(err => {
      console.error(err);
      $("meta").textContent = "The viewer could not start: " + err.message;
    });
  </script>
</body>
</html>

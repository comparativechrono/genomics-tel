<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mol*: a 3D viewer open at haemoglobin</title>
  <!-- Mol* 5.12.0 from jsDelivr: one stylesheet and one script. The integrity hashes stop changed files from running. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@5.12.0/build/viewer/molstar.css"
        integrity="sha384-RIontCdJN53gEl2fmiHN+4bscIBvaUaOiCeeGktXqmFqdEBF+COnSdt9O4IKFSvq"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/molstar@5.12.0/build/viewer/molstar.js"
          integrity="sha384-Mx9hwknXam3/nCj5WsEpyvr6nqiUp8vVLEh0ZG9OXpFepTFhVKTdEOJ4JG0XjMLf"
          crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px 16px; color: #172033; background: #fff; }
    h1 { font-size: 1.05rem; margin: 0 0 8px; }
    /* Mol* fills its container, so the container needs a height and a position */
    #viewer { position: relative; height: 400px; }
    #status { margin: 6px 0 0; }
  </style>
</head>
<body>
  <h1>Human haemoglobin (PDB 4HHB)</h1>
  <div id="viewer" role="region" aria-label="Interactive 3D model of human deoxyhaemoglobin, PDB entry 4HHB"></div>

  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const say = text => { document.getElementById("status").textContent = text; };

    molstar.Viewer.create("viewer", {
      layoutIsExpanded: false,     // stay inside the page rather than filling the window
      layoutShowControls: false,   // no side panels or sequence
      viewportShowAnimation: false,
      pdbProvider: "pdbe"          // where loadPdb fetches entries: "pdbe" (the default), "rcsb" or "pdbj"
    }).then(async viewer => {
      await viewer.loadPdb("4hhb");   // fetches https://www.ebi.ac.uk/pdbe/entry-files/download/4hhb.bcif
      // Mol* can finish without a structure when the download fails, so check
      if (viewer.plugin.managers.structure.hierarchy.current.structures.length === 0) {
        throw new Error("the file did not arrive");
      }
    }).catch(err => {
      console.error(err);
      say("The structure could not be loaded (" + ((err && err.message) || err) + "). Check your connection, or try again later.");
    });
  </script>
</body>
</html>

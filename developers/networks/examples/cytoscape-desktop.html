<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A network and style saved from Cytoscape desktop</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.3/dist/cytoscape.min.js"
          integrity="sha384-qPKQxl9uMXOw7vSTUDAnpUilhLuulovw6P5Z4db4bqxW5VhumS7przEmHX0iM0Oc"
          crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px 16px; color: #172033; background: #fff; }
    h1 { font-size: 1.05rem; margin: 0 0 4px; }
    h2 { font-size: 0.95rem; margin: 10px 0 4px; }
    p { margin: 0 0 6px; font-size: 14px; color: #3b4659; }
    #cy { height: 330px; border: 1px solid #c3cbd8; border-radius: 6px; }
    #info { min-height: 1.5em; margin-top: 6px; color: #172033; }
    ul { margin: 0; padding-left: 1.3rem; font-size: 14px; }
    @media (min-width: 600px) { ul { columns: 2; column-gap: 2rem; } }
  </style>
</head>
<body>
  <h1>Six proteins of the p53 pathway, laid out in Cytoscape desktop</h1>
  <p>The network comes from <code>data/p53-pathway.cyjs</code> and its look from <code>data/p53-pathway-style.json</code>.
     Click a protein to see the description stored with it.</p>
  <div id="cy" role="img" aria-label="Six proteins of the p53 pathway. The list under the network gives the same interactions."></div>
  <p id="info" aria-live="polite"></p>
  <h2>Interactions</h2>
  <ul id="list"></ul>

  <script>
    async function getJSON(url) {
      const reply = await fetch(url);
      if (!reply.ok) throw new Error(url + ": HTTP " + reply.status);
      return reply.json();
    }

    Promise.all([getJSON("data/p53-pathway.cyjs"), getJSON("data/p53-pathway-style.json")])
      .then(([network, styles]) => {
        // A style file holds a list of named styles. Each has a Cytoscape.js stylesheet in "style".
        const chosen = styles.find(s => s.title === "p53 teaching style") || styles[0];

        const cy = cytoscape({
          container: document.getElementById("cy"),
          elements: network.elements,                 // nodes and edges; each node carries its saved position
          style: chosen.style.concat([
            // Desktop styles name Java fonts such as "SansSerif", which browsers do not have
            { selector: "node", style: { "font-family": "system-ui, -apple-system, sans-serif" } }
          ]),
          layout: { name: "preset", padding: 30 },    // use the saved positions instead of a new layout
          userZoomingEnabled: false                   // let the mouse wheel scroll the page
        });

        // Columns of Cytoscape's tables arrive as fields in data, here name, Description, interaction and PubMed
        const name = id => cy.getElementById(id).data("name");
        document.getElementById("list").innerHTML = cy.edges().map(e =>
          `<li>${name(e.data("source"))} ${e.data("interaction")} ${name(e.data("target"))} ` +
          `(<a href="https://pubmed.ncbi.nlm.nih.gov/${e.data("PubMed")}/" target="_blank" rel="noopener">PubMed ${e.data("PubMed")}</a>)</li>`).join("");

        cy.on("tap", "node", event => {
          document.getElementById("info").textContent = event.target.data("name") + ": " + event.target.data("Description") + ".";
        });
      })
      .catch(err => {
        document.getElementById("info").textContent = "Could not read the files (" + err.message + "). Open this page from a web server.";
        console.error(err);
      });
  </script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>igv.js: open files from your own computer</title>
  <script src="https://cdn.jsdelivr.net/npm/igv@3.8.9/dist/igv.min.js"
          integrity="sha384-J2SJJANecDBpqn++zIO/AJY/Fpk64lYDp43ibq7bmQONxd9b80ZpvLKBrKdCtYIu"
          crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px 16px; color: #172033; background: #fff; }
    h1 { font-size: 1.05rem; margin: 0 0 6px; }
    p { margin: 0 0 6px; }
    fieldset { margin: 0 0 8px; border: 1px solid #c3cbd8; border-radius: 6px; padding: 6px 10px 8px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; font-size: 14px; margin-bottom: 4px; }
    #log { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-line; color: #3b4659; }
  </style>
</head>
<body>
  <h1>View your own files</h1>
  <p>Your browser reads the files. Nothing is uploaded.</p>

  <fieldset>
    <legend>1. Reference sequence (optional)</legend>
    <label for="ref-files">A FASTA file and its .fai index</label>
    <input id="ref-files" type="file" multiple accept=".fa,.fasta,.fna,.fai">
  </fieldset>
  <fieldset>
    <legend>2. Data tracks</legend>
    <label for="track-files">VCF, BED, GFF3, bigWig, bigBed or BAM files, with their index files (.tbi, .csi, .bai)</label>
    <input id="track-files" type="file" multiple>
  </fieldset>
  <p id="log" role="status" aria-live="polite"></p>
  <div id="igv"></div>

  <script>
    const INDEX_EXTENSIONS = [".tbi", ".csi", ".bai", ".crai", ".fai", ".idx"];
    const isIndex = f => INDEX_EXTENSIONS.some(ext => f.name.toLowerCase().endsWith(ext));
    // "x.vcf.gz.tbi" belongs to "x.vcf.gz"; "x.bai" can also belong to "x.bam"
    const findIndex = (f, files) => files.find(i => isIndex(i) && i !== f &&
      (i.name.startsWith(f.name + ".") || i.name.replace(/\.[^.]+$/, "") === f.name.replace(/\.[^.]+$/, "")));
    const log = msg => { document.getElementById("log").textContent += msg + "\n"; };

    // GRCh38 from UCSC's files, which costs far less to download than genome: "hg38".
    // A FASTA chosen in step 1 replaces it.
    const UCSC = "https://hgdownload.soe.ucsc.edu";
    igv.createBrowser(document.getElementById("igv"), {
      reference: {
        id: "hg38",
        name: "Human (GRCh38/hg38)",
        twoBitURL: UCSC + "/goldenPath/hg38/bigZips/hg38.2bit",
        chromSizesURL: UCSC + "/goldenPath/hg38/bigZips/hg38.chrom.sizes",
        cytobandURL: UCSC + "/goldenPath/hg38/database/cytoBandIdeo.txt.gz",
        maneBbURL: UCSC + "/gbdb/hg38/mane/mane.1.0.bb",
        maneTrixURL: UCSC + "/gbdb/hg38/mane/mane.1.0.ix"
      },
      loadDefaultGenomes: false,
      locus: "HBB",
      tracks: [
        { name: "MANE Select transcripts", url: UCSC + "/gbdb/hg38/mane/mane.1.0.bb", format: "bigBed", labelField: "geneName2" }
      ]
    }).then(function (browser) {

      document.getElementById("ref-files").addEventListener("change", async e => {
        const files = Array.from(e.target.files);
        const fasta = files.find(f => !isIndex(f));
        if (!fasta) { log("Choose a FASTA file, and its .fai index if you have one."); return; }
        const fai = findIndex(fasta, files);
        try {
          await browser.loadGenome({
            id: fasta.name, name: fasta.name,
            fastaURL: fasta,                  // a File object works wherever igv.js expects a URL
            indexURL: fai                     // without a .fai the whole FASTA is read into memory
          });
          log("Reference: " + fasta.name + (fai ? " (indexed)" : " (not indexed)"));
        } catch (err) { log("Could not load " + fasta.name + ": " + err.message); }
      });

      document.getElementById("track-files").addEventListener("change", async e => {
        const files = Array.from(e.target.files);
        for (const f of files.filter(f => !isIndex(f))) {
          const index = findIndex(f, files);
          const config = { name: f.name, url: f };
          if (index) config.indexURL = index;
          else config.indexed = false;        // small files can be read whole, without an index
          try {
            await browser.loadTrack(config);
            log("Loaded " + f.name + (index ? " with " + index.name : ""));
          } catch (err) { log("Could not load " + f.name + ": " + err.message); }
        }
        e.target.value = "";                  // so the same files can be chosen again
      });
    });
  </script>
</body>
</html>

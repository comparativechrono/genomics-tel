<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>igv.js: a genome browser open at HBB</title>
  <!-- igv.js 3.8.9 from jsDelivr. The integrity hash stops a changed file from running. -->
  <script src="https://cdn.jsdelivr.net/npm/igv@3.8.9/dist/igv.min.js"
          integrity="sha384-J2SJJANecDBpqn++zIO/AJY/Fpk64lYDp43ibq7bmQONxd9b80ZpvLKBrKdCtYIu"
          crossorigin="anonymous"></script>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px 16px; color: #172033; background: #fff; }
    h1 { font-size: 1.05rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>The human β-globin gene (HBB) on GRCh38</h1>
  <div id="igv"></div>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const say = text => { document.getElementById("status").textContent = text; };

    // The element with id="igv" also makes a global called igv, so test for the function itself
    if (typeof window.igv?.createBrowser !== "function") {
      say("igv.js did not load. Check the connection and reload the page.");
    } else {
      igv.createBrowser(document.getElementById("igv"), {
        genome: "hg38",   // GRCh38 as hosted by the IGV team: sequence, chromosome bands and RefSeq genes
        locus: "HBB"      // a gene name, or coordinates such as "chr11:5,225,464-5,229,395"
      }).catch(err => say("The genome could not be loaded (" + err.message + "). Check the connection, or try again later."));
    }
  </script>
</body>
</html>

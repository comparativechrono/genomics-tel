# Sites and tools we have made, shown on the "Our sites" page.
# Groups appear in this order. `featured: true` also lists a site on the home page.
# Fields: name, url (live site, optional), github (optional), for (audience),
#         description, notes (optional, one or two short sentences)

- group: Teaching sites
  intro: Sites we use in our own teaching. They run in a web browser, so students have nothing to install.
  items:
    - name: How aligners work
      url: https://comparativechrono.github.io/how-aligners-work/
      github: https://github.com/comparativechrono/how-aligners-work
      for: students and educators
      description: An interactive tutorial on the algorithms inside sequence aligners and read mappers, from hashing and the Burrows–Wheeler transform to BLAST, multiple alignment and hidden Markov models, with exercises in every chapter.
      notes: Fourteen chapters, about eight hours in all. Runs entirely in the browser and works offline.
      featured: true
    - name: Bioinformatics algorithms in Python
      url: https://comparativechrono.github.io/bioinformatics-algorithms-python/
      github: https://github.com/comparativechrono/bioinformatics-algorithms-python
      for: students and educators
      description: A three-hour practical in which students write Python in the browser and use it to look inside alignment, BLAST, trees and networks, with exercises that check themselves.
      notes: Python runs in the page (Pyodide). Work can be saved as a Jupyter notebook.
      featured: true
    - name: R workbench
      url: https://comparativechrono.github.io/R-workbench/
      github: https://github.com/comparativechrono/R-workbench
      for: students and educators
      description: R in the browser for practicals. The R console, an RStudio-style editor (with R Markdown, Quarto and Shiny), Jupyter-style notebooks and a terminal sit next to the practical's instructions.
      notes: Runs on webR. The optional AI assistant needs each student's own API key.
      featured: true
    - name: Bioinformatics workbench
      url: https://comparativechrono.github.io/bioinformatics-workbench/
      github: https://github.com/comparativechrono/bioinformatics-workbench
      for: students and educators
      description: Real bioinformatics programs compiled to run in the browser, including fastp, minimap2, BWA, samtools, bcftools, Salmon and PLINK 2, with Python and R notebooks, a genome browser, a 3D structure viewer and a network viewer.
      notes: Needs an internet connection to fetch Python, R and database results.
      featured: true

- group: Practicals
  intro: Complete practicals, with the instructions on one side of the screen and a workbench on the other. Each shows a different side of technology enhanced learning for genomics.
  items:
    - name: Genomic variant analysis practicals
      url: https://comparativechrono.github.io/variant-practicals/
      github: https://github.com/comparativechrono/variant-practicals
      for: students and educators
      description: Two practicals and a coursework workbench. Students take raw exome reads to a variant that matters in the clinic, CYP2C19*2, then annotate, filter and interpret variants, and finally analyse a patient's exome for their coursework.
      notes: Real samtools and bcftools run in the browser, and FastQC, BWA-MEM and FreeBayes replay their recorded output. Answers are saved in the student's browser.
      featured: true
    - name: Variant calling practical
      url: https://comparativechrono.github.io/variant-lab/
      github: https://github.com/comparativechrono/variant-lab
      for: students and educators
      description: Students align human and yeast reads with minimap2 or Bowtie 2, call variants with bcftools or exactSNP, and compare what each tool and setting finds, from a terminal or from Galaxy-style forms that share the same files.
      notes: The aligners and variant callers are the real programs compiled to WebAssembly, and the data come with the site, so it needs no outside services during the practical.
    - name: Pipelines and reproducibility
      url: https://comparativechrono.github.io/pipelines-practical/
      github: https://github.com/comparativechrono/pipelines-practical
      for: students and educators
      description: An extension practical that turns the reads-to-variants analysis into a reproducible pipeline in three ways, with Snakemake and conda, as a Galaxy workflow and with an AI agent, and asks which one meets Claerbout's principle.
      notes: minimap2, samtools and bcftools are real programs compiled to WebAssembly. Snakemake, conda and Galaxy are recreated in the browser around them.
    - name: AI agents for bioinformatics
      url: https://comparativechrono.github.io/ai-agents-practical/
      github: https://github.com/comparativechrono/ai-agents-practical
      for: students and educators
      description: A two-hour practical on AI assistants and AI agents. Students answer one question, which genotype NA12878 has at CYP2C19*2, with an assistant that writes commands and with an agent that runs them, and then turn the agent's run into an analysis they can repeat.
      notes: The programs are the real ones, compiled to WebAssembly, and the AI is a real model. Each student enters their own API key, and Google's Gemini API has a free tier.
    - name: Yeast, data and AI
      url: https://comparativechrono.github.io/yeast-data-ai/
      github: https://github.com/comparativechrono/yeast-data-ai
      for: students and educators
      description: Which genes does baker's yeast need to live? Students answer with a table of 5,481 genes, a Python notebook, machine learning, a protein language model and AlphaFold structures, helped by an AI coding assistant. Some of its answers contain deliberate mistakes for students to catch.
      notes: Python runs in the page (Pyodide). The assistant gives prepared answers, or connects to a live model with the student's own API key. About 2½ to 3 hours.
    - name: Proteins in 3D
      url: https://comparativechrono.github.io/pharmacology-practical/
      github: https://github.com/comparativechrono/pharmacology-practical
      for: students and educators
      description: Students study the immune receptor TLR4, its co-receptor MD-2 and bacterial LPS with UniProt, the Protein Data Bank, a 3D viewer and AlphaFold, then make a figure of their own, without leaving the page.
      notes: Progress and answers are saved in the student's browser, and can be downloaded to keep or hand in.
    - name: Introduction to R
      url: https://comparativechrono.github.io/r-training/
      github: https://github.com/comparativechrono/r-training
      for: anyone new to R
      description: Two short courses, R basics and then the tidyverse, with real R running in an RStudio-style workbench beside the instructions. Each course ends with a certificate to download.
      notes: Adapted from Babraham Bioinformatics' Introduction to R (with Tidyverse) by Simon Andrews and Laura Biggins. Built on the R workbench.

- group: Learning through games
  intro: An example of gamified learning, where the course is a game with tasks to choose, experience points to earn and levels to reach.
  items:
    - name: "Datascape: Cambridge"
      url: https://comparativechrono.github.io/datascape-cambridge/
      github: https://github.com/comparativechrono/datascape-cambridge
      for: data science apprentices and their tutors
      description: A workplace simulator set in Cambridge. Apprentices take on scenario tasks in SQL, data cleaning, machine learning, statistics and data ethics. Each task earns experience points towards the next level, and finishing one unlocks harder ones. The tasks are mapped to the Level 6 Data Scientist apprenticeship standard.
      notes: Progress is saved in the browser.

- group: Data and science communication
  intro: An interactive chart for lectures and outreach.
  items:
    - name: Sequencing cost chart
      url: https://comparativechrono.github.io/sequencing-cost-visualisation/
      github: https://github.com/comparativechrono/sequencing-cost-visualisation
      for: educators, students and researchers
      description: How the cost of DNA sequencing per gigabase has fallen since 2001, by platform, with figures you can export for slides and papers.
      notes: Data from the NHGRI and manufacturers' specifications. Check values against the sources before you publish them.

- group: Teaching materials
  intro: Notebooks for courses. These live on GitHub rather than as websites.
  items:
    - name: Computational biology notebooks
      github: https://github.com/comparativechrono/computational_biology_notebooks
      for: students
      description: Jupyter notebooks for teaching computational biology, including differential equations, SIR models, bootstrapping, Monte Carlo methods and mixed models.
    - name: Learn maths with Python
      github: https://github.com/comparativechrono/learn_maths_with_python
      for: students
      description: Notebooks for learning mathematics with Python, from equations to calculus.
    - name: Principles of Data Science notebooks
      github: https://github.com/comparativechrono/Principles-of-Data-Science
      for: students
      description: Weekly notebooks to go with the textbook Principles of Data Science.

- group: Code
  intro: Software that you can build into your own teaching sites.
  items:
    - name: Genomics WebAssembly tools
      github: https://github.com/comparativechrono/genomics-wasm
      for: developers
      description: Bioinformatics programs compiled to WebAssembly for web browsers and Node.js, 25 in all, among them BWA, minimap2, HISAT2, Salmon, kallisto, StringTie, FreeBayes, Kraken2, MACS3, Primer3 and PLINK 2, with DESeq2 through webR. Each is a separate package with a JavaScript API, tested against the original program.
      notes: The tools run the real algorithms rather than replaying saved results. The Bioinformatics workbench is built on them.

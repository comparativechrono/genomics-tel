{%- include ads-flags.html -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="{{ '/assets/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
{% seo %}
{%- comment -%} The AdSense code goes on every page (Google checks the home page, and its consent message needs it); ad units appear only where ad.html is included. {%- endcomment -%}
{%- if ads_live and page.adsense_code != false %}
<meta name="google-adsense-account" content="{{ site.adsense.publisher_id }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense.publisher_id }}" crossorigin="anonymous"></script>
{%- endif %}
